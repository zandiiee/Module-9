<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Manrope:wght@200..800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/4df559c6eb.js" crossorigin="anonymous"></script>
</head>
<body>
    <section class="loginBody">

        <header>
            <div id="logo">
            <img src="./images/libra_logo.png" width="150">
            </div>
            <h1> LIBRA</h1>

        </header>

            


        <article id="login1">
            <h1>Sign into your library account</h1>
            <h3>Access borrowed volumes, renewal requests, and digital catalog. </h3>
        </article>

        <div id="login">
        
            <label for="email"><i class="fa-regular fa-envelope" style="color: rgb(20, 21, 22);"></i>Institutional or Personal Email:</label>
            <input type="email" id="email" name="email" placeholder="@caitymclean9@gmail.com" required >

            <div class="passwords1">
                <div id="firstPass">
            <label for="password"><i class="fa-solid fa-lock" style="color: rgb(20, 21, 22);"></i>Master password:</label>
            <input type="password" id="password" name="password" placeholder="*****" required >
                </div>
                
                <div id="secondPass">
            <label for="password"><i class="fa-regular fa-square-check" style="color: rgb(20, 21, 22);"></i>Confirm password:</label>
            <input type="password" id="password" name="password" placeholder="****" required >
                </div>

            </div>

            <a href="forgotpassword.html" id="forgot">Forgot password?</a>


        <div class="agreement">

            <input 
                    type="checkbox" 
                    id="agreement" 
                    name="agreement"
                    required
            >

            <label for="agreement">
                    Remember this workstation
            </label>

            </div>

            <div id="loginButton">
                <button type="submit" id="signIn">Log in to Libra</button>
            </div>

            <div id="split">
                <div id="line"></div>
                <span id="splitText">OR CONTACT US</span>
                <div id="line"></div>
            </div>

            <section class="loginType2">
            <div id="card3">
                <h3><i class="fa-solid fa-book-open" style="color: rgb(20, 21, 22);"></i>Member Demo</h3>
                <p>Reader & Research</p>
            </div>

            <div id="card4">
                <h3><i class="fa-solid fa-user-shield" style="color: rgb(20, 21, 22);"></i>Librarian/ Admin</h3>
                <p>Circulation & Catalog</p>
            </div>

        </section>

        <div id="log2">
                <p>New to Libra?</p>
                <button id="signIn">Sign up for a library card.</button>
            </div>

        </div>

    </section>
    <script type="module" src="./Auth/signIn.js"></script>
</body>
</html>
