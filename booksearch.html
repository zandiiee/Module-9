<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="booksearch.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Manrope:wght@200..800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/4df559c6eb.js" crossorigin="anonymous"></script>
    <title>Book Search</title>
</head>
<body>

    <header>

        <section class="memberdash">
            
        <div id="dashLogo">
        <img src="./images/libra_logo.png" width="100">
        </div>
        <h2>Libra</h2>

        <div class="headerLinks">

            <div id="homelink">
                <a href="dashboard.html">
                Home
                </a>
            </div>

            <div id="searchlink">
                Search Books
            </div>

       

            <div id="profileLink">
               <a href="profile.html"> Profile </a>
            </div>

        
        </div>

            <div id="adminlink">
                <a href="admindash.html"> 
                Admin portal
                </a>
            </div>
            <div class="righticons"> 
            <i class="fa-regular fa-bell" style="color: rgb(20, 21, 22);"></i>
            <i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(20, 21, 22);"></i>
            </div>

        </section>

    </header>

    <main>
        <div id="bookheader">
            <h2> Explore The Library Catalog </h2>
            <p>Search across 12000+ titles, journals, monographs, and research materials.</p>
        </div>

      <section class="searchbarBox">
        <div id="searchDropbar">
            <div id="searchicon"> 
            <i class="fa-solid fa-filter" style="color: rgb(116, 192, 252);"></i>
            </div>
            <!-- Filter by ISBN or Author (Optional feature, we will link the main one) -->
            <input type="text" placeholder="Title, Author or ISBN">
        </div>

        <div id="searchbar">
            <div id="searchicon"> 
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(177, 151, 252);"></i>
            </div>
            <!-- ADDED ID HERE -->
            <input type="text" id="searchInput" placeholder="Search by Title, Author, or Genre..." >
        </div>

        <div id="catalog">
            <!-- ADDED ID HERE -->
            <p><button id="searchBtn" style="background: none; border: none; cursor: pointer; color: inherit; font-family: inherit; font-size: inherit;"><a href="#">Search Catalog</a></button></p>
        </div>

      </section>

      <section class="banner">
        <button id="banneroption"> 
        <h4>All Categories</h4>
        </button>
        
        <button id="banneroption"> 
        <h4>Philosophy & Ethics</h4>
        </button>
       
        <button id="banneroption"> 
         <h4>Fiction</h4> 
        </button>

        <div id="bannerbuttons"> 
        <button>Show Available </button>
        <button>Physical </button>
        <button>Digital/eBook </button>
        </div>

        <div id="bannerdrop"> 

        <label for="book">Sort</label>

            <select id="drop" name="relevance">
                <option value="most-relevant">Most Relevant</option>
                <option value="least-relevant">Least Relevant</option>
            </select>

        </div>

      </section>

      <div id="searchresultsheader"> 
      <h3>Catalog Query</h3>
      <!-- ADDED ID HERE for the results count -->
      <p id="resultsCount">Loading catalog...</p>
      </div>

      <section class="serachresults">
        <!-- ADDED ID HERE to clear out the hardcoded HTML and put live data -->
        <div class="grid" id="searchResultsGrid">
            <!-- JS will inject the books here -->
        </div>
      </section>

    </main>

    <footer>
        
        <img src="./images/libra_logo.png" width="100">
        <h4>Libra</h4>
        <p>Digital Archive and Research Library</p>
        

        <div id="footerLinks"> 
        <h4>Catalog</h4>
        <h4>Borrowing Policy</h4>
        <h4>Contact</h4>
        <h4>Admin Portal</h4>
        </div>
    </footer>
    
    <!-- Link to the search JavaScript file -->
    <script type="module" src="./javascript/booksearch.js"></script>
</body>
</html>
